services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

  scrapper:
    build: .
    ports:
      - "7778:7778"
    environment:
      PORT: "7778"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.1"
          memory: 512M
